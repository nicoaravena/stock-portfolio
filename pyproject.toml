[project]
name = "stock-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas Aravena", email = "naravena@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "django~=6.1.2",
    "django-ninja~=1.7.1",
    "pydantic~=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest-cov]
target = "src/"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stock_portfolio.api.settings"

[tool.ruff]
extend-exclude = ["src/stock_portfolio/api/migrations"]
